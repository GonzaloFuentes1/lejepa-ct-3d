[project]
name = "lejepa-ct-3d"
version = "0.1.0"
description = "3D CT foundation model — LeJEPA SSL pretraining for CVPR 2026 CT diagnosis challenge (FLARE / AMOS / NLST)"
requires-python = ">=3.10"

dependencies = [
    # PyTorch — pinned to cu121 build (see [tool.uv.sources] below)
    # To upgrade: change the pin here + update the index url if CUDA version changes
    "torch>=2.3.0,<2.11",
    "pytorch-lightning>=2.3.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "monai>=1.3.0",
    "nibabel>=5.2.0",
    "einops>=0.7.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "wandb>=0.17.0",
    "timm>=1.0.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.23.0",
    "matplotlib>=3.8.0",
    "scikit-image>=0.22.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
# pip install -e ".[download]"  — needed for dataset download script
download = [
    "synapseclient>=4.0.0",
    "kaggle>=1.6.0",
    "hf-transfer>=0.1.6",
]
# pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
    "ipywidgets>=8.0.0",
    "ipympl>=0.9.0",
    "jupyter>=1.0.0",
]

[tool.uv]
# PyPI is the default index. torch/torchvision are routed to the
# PyTorch CUDA wheel index via [tool.uv.sources] below.
# To switch CUDA version change the url here and in [tool.uv.sources]:
#   cu118 → https://download.pytorch.org/whl/cu118
#   cpu   → https://download.pytorch.org/whl/cpu

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true   # only used when a package explicitly references this index

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# LeJEPA official package (DDP-correct EppsPulley test)
# Uncomment once the package is publicly available:
# lejepa = { git = "https://github.com/galilai-group/lejepa.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "data", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
