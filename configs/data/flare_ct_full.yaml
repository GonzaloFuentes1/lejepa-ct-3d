# FLARE-Task4-CT-FM — SSL pretraining on the full dataset (AllData Track)
#
# Dataset: FLARE-MedFM/FLARE-Task4-CT-FM (~668GB, ~133K scans)
#   - Multiple sources: AMOS, FLARE22/23, LiTS, MSD, TotalSegmentator, etc.
#   - 1 channel, standard HU windowing for whole-body CT
#
# Challenge rules:
#   - Track: AllData (100% of the pretrain set, pretrained from scratch)
#   - Supervised finetuning is forbidden in Task 1 LP
#
# Scale estimates (B_eff=128, 4×H100):
#   ~133K scans → ~1044 steps/epoch
#   100K steps  → ~96 effective passes over the dataset
#   ViT-H time: ~3.9h for 100K steps (data loading may be the bottleneck)

dataset: flare_ct
data_dir: ${oc.env:LEJEPA_DATA_ROOT,./data}/flare_ct_pretrain_full
in_channels: 4  # Multi-windowing Pillar-0: soft tissue, lung, bone, mediastinum
num_classes: 1          # Pretrain only, unused
# (96, 160, 160) @ 1.5mm: 144mm depth × 240mm in-plane
# Tokens: (12, 20, 20) = 4800 with patch_size=8  [ctx 25%=1200, tgt ~1200]
patch_size: [96, 160, 160]
spacing: [1.5, 1.5, 1.5]
batch_size_per_gpu: 32
num_workers: 16
prefetch_factor: 4
cache_num: 0
npy_dir: ${oc.env:LEJEPA_DATA_ROOT,./data}/flare_ct_pretrain_full_npy
cropfirst: false         # npy_dir takes priority over cropfirst

# CT normalization
norm_mode: hu_window
hu_min: -1000
hu_max: 1000

# 95/5 split: with 133K scans, 5% is already ~6700 validation volumes
val_split: 0.05

# Scan only training subdirectories (excludes val_downstream)
train_subdirs: [train_part1, train_part2]
coreset_manifest: null
