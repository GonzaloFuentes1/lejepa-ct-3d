# FLARE-Task4-CT-FM — SSL pretraining, Coreset Track
#
# Dataset: FLARE-MedFM/FLARE-Task4-CT-FM
#   - 3D CT volumes from multiple sources (AMOS, FLARE, LiTS, MSD, etc.)
#   - 1 channel, standard HU windowing for whole-body CT
#   - Coreset: 10% selected, stratified by source
#
# Challenge rules:
#   - Track: Coreset (10% of the pretrain set, pretrained from scratch)
#   - Supervised finetuning is forbidden in Task 1 LP

dataset: flare_ct
data_dir: ${oc.env:LEJEPA_DATA_ROOT,./data}/flare_ct_pretrain_full
in_channels: 1
num_classes: 1          # Pretrain only, unused
patch_size: [96, 160, 160]
spacing: [1.5, 1.5, 1.5]
batch_size_per_gpu: 64
num_workers: 32
prefetch_factor: 6
cache_num: 0
npy_dir: ${oc.env:LEJEPA_DATA_ROOT,./data}/flare_ct_pretrain_full_npy
cropfirst: false         # npy_dir takes priority over cropfirst

# CT normalization: HU windowing
# The [-1000, 1000] HU range covers most tissues (air, fat, soft tissue, bone)
# Then clipped and normalized to [0, 1]
norm_mode: hu_window
hu_min: -1000
hu_max: 1000

# 90/10 train/val split of the coreset
val_split: 0.10

# Scan only training subdirectories (excludes val_downstream)
train_subdirs: [train_part1, train_part2]
coreset_manifest: ${oc.env:LEJEPA_DATA_ROOT,./data}/flare_ct_pretrain_full/coreset_manifest.json
